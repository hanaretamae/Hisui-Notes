[package]
name = "wasm-host"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["wasmi", "wasmtime-cranelift"]
wasmi = ["dep:wasmi"]
# Cranelift（JIT）とPulleyへのコンパイルの両方を含む。
wasmtime-cranelift = ["dep:wasmtime", "wasmtime/cranelift", "wasmtime/pulley"]
# コンパイラーを含まず、事前コンパイル済みのPulleyバイトコードだけを実行する（iOSを想定した構成）。
wasmtime-pulley-runtime = ["dep:wasmtime", "wasmtime/pulley"]

[dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }
wasmi = { version = "=2.0.0", optional = true }
wasmtime = { version = "=50.0.1", optional = true, default-features = false, features = ["runtime", "std"] }

[profile.release]
debug = 1
