[package]
name = "protocol-clients"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.9.0", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "macros"] }
agent-client-protocol = { version = "=5.0.0", features = ["process", "stdio"] }
lsp-types = "=0.97.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.8"
schemars = "1"
futures = "0.3"
