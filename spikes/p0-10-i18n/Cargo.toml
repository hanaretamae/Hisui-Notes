[package]
name = "i18n-spike"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
all = ["segmenter", "collator", "normalizer", "fallback", "plurals", "decimal", "datetime", "fluent"]
segmenter = ["dep:icu_segmenter"]
collator = ["dep:icu_collator", "dep:icu_locale_core"]
normalizer = ["dep:icu_normalizer"]
fallback = ["dep:icu_locale", "dep:icu_locale_core"]
plurals = ["dep:icu_plurals", "dep:icu_locale_core"]
decimal = ["dep:icu_decimal", "dep:icu_locale_core"]
datetime = ["dep:icu_datetime", "dep:icu_calendar", "dep:icu_locale_core"]
fluent = ["dep:fluent-bundle", "dep:fluent-langneg", "dep:unic-langid"]

[dependencies]
icu_segmenter = { version = "=2.4.0", optional = true }
icu_collator = { version = "=2.4.0", optional = true }
icu_normalizer = { version = "=2.4.0", optional = true }
icu_locale = { version = "=2.4.0", optional = true }
icu_locale_core = { version = "2.4.0", optional = true }
icu_plurals = { version = "=2.4.0", optional = true }
icu_decimal = { version = "=2.4.0", optional = true }
icu_datetime = { version = "=2.4.0", optional = true }
icu_calendar = { version = "2.4.0", optional = true }
fluent-bundle = { version = "=0.16.0", optional = true }
fluent-langneg = { version = "0.13", optional = true }
unic-langid = { version = "=0.9.6", optional = true, features = ["macros"] }

[profile.release]
strip = true
