# cargo-deny の設定（ADR-0011: 依存ライブラリのライセンスの許可リスト、ADR-0001: GPUI の参照方式）
# 実行: nix develop -c cargo deny check

[graph]
# xtask は開発用のため含める（製品のバイナリには含まれない）
all-features = false

[licenses]
# ADR-0011 の初期の許可リストと、P0-01 で GPUI の依存に選択式の一部として現れた識別子
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# ワークスペース内のクレート（publish = false）は対象外
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI（Zed）と、Zed の [patch]・依存が参照するリポジトリ（ADR-0001）。GPUI の更新時に照合する。
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/zed-industries/async-task.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/khronos-egl",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/gfx-rs/wgpu",
]

[advisories]
# RustSec のデータベースを取得して検査する（ネットワークが必要）
# 脆弱性は推移的な依存も含めてすべて拒否する。保守終了（unmaintained）は、ワークスペースの直接の依存のみを対象とする。
# GPUI（ADR-0001 でコミットを固定）の推移的な依存に保守終了の通知があり（2026-11-14: paste、rustybuzz、ttf-parser、
# zbus_names、zvariant、zvariant_derive）、GPUI を更新しない限り解消できないため。GPUI の更新時に見直す。
unmaintained = "workspace"
