# CI（実行計画 §6.1、ADR-0010）。検証は Nix の devShell の中で行い、ローカルと同じ手順で再現できるようにする。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / deps (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Prepare devShell
        run: nix develop -c true
      - name: Format
        run: nix develop -c cargo fmt --all --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: nix develop -c cargo test --workspace --locked
      - name: Dependency rules (ADR-0002)
        run: nix develop -c cargo xtask deps

  deny:
    name: cargo-deny (licenses / advisories / sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: cargo deny check
        run: nix develop -c cargo deny check
